<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=yes">
  <title>HabeshaCart • mini store</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- header -->
    <div class="header">
      <h1>
        <i class="fas fa-store-alt"></i> HabeshaCart
      </h1>
      <div class="cart-icon-wrapper" id="cartToggle">
        <i class="fas fa-shopping-basket"></i>
        <span class="cart-badge" id="cartBadge">0</span>
      </div>
    </div>

    <!-- product grid dynamically rendered -->
    <div class="product-grid" id="productGrid"></div>

    <!-- cart drawer -->
    <div class="cart-drawer" id="cartDrawer">
      <div class="drawer-header">
        <span><i class="fas fa-shopping-bag"></i> Your Cart</span>
        <i class="fas fa-times" id="closeDrawerBtn"></i>
      </div>
      <ul class="cart-items-list" id="cartItemsList"></ul>
      <div class="cart-summary" id="cartSummary">
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">0.00 ETB</span></div>
        <div class="summary-row"><span>Delivery</span><span id="deliveryFee">0.00 ETB</span></div>
        <div class="summary-row total"><span>Total</span><span id="totalAmount">0.00 ETB</span></div>
      </div>
      <button class="checkout-btn" id="checkoutBtn"><i class="fas fa-mobile-alt"></i> Pay with Telebirr</button>
    </div>
  </div>

  <!-- Payment modal (Telebirr simulation) -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal" id="modalContent">
      <!-- dynamic content injected via JS -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
