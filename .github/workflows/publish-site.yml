name: publish-site

on:
  push:
    paths:
      - .github/workflows/publish-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch verified page
        run: |
          curl -fsSL https://paste.rs/PfQRa -o /tmp/index.html
          echo "cfeea40c2ecfbc7f473e5d25ebe26bfc962bc77b8d4397521b16933d975ab153  /tmp/index.html" | sha256sum -c -
          cp /tmp/index.html index.html

      - name: Commit and push
        run: |
          git config user.name "Bereket Tadesse"
          git config user.email "tadessebereket779@gmail.com"
          git add index.html
          if git diff --cached --quiet; then echo "already up to date"; exit 0; fi
          git commit -m "Publish one-page layout with reworked About and project cards" -m "Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push
