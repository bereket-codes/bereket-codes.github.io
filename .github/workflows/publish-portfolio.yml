name: publish-portfolio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify staged parts
        run: |
          set -euo pipefail
          while read -r hash file; do
            [ -z "$hash" ] && continue
            echo "$hash  $file" | sha256sum -c - || { echo "PART_FAIL: $file"; exit 1; }
          done <<'SUMS'
            58bb5c23673131e85817322da57c10bc717f9d4b1c09e9c234d8b95ea8b7cfd9  .publish/p00
            f403b1fe59954dcd97674e9c1388074efa7f8f0214fc689a3d719fdf8043e32e  .publish/p01
            70b8b4a490734bd20b8e56372e4ef0b5478b69d1f7c8abceac0b3f793cc34934  .publish/p02
            398128ba9c5d788a8b00d86570b0feacd0367a9e4d8aeffd94df147940057d2c  .publish/p03
            f7ac8d92d12957d3832c72794c1fc91d64756dc52ed03bb8b8c2b79e4fa61c6f  .publish/p04
          SUMS

      - name: Assemble index.html
        run: |
          set -euo pipefail
          cat .publish/p00 .publish/p01 .publish/p02 .publish/p03 .publish/p04 > index.html
          echo "2ff06a3e012a6423bdfab0cc06994f032ef431a3454e373277ef84976fdc3502  index.html" | sha256sum -c -
          wc -c index.html

      - name: Render og.jpg
        run: |
          set -euo pipefail
          mkdir -p .render
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome" ]; then echo "NO_CHROME"; exit 1; fi
          echo "using $chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1200,630 \
            --screenshot="$PWD/.render/og.png" "file://$PWD/.publish/og-card.html" 2> .render/chrome.log || true
          tail -3 .render/chrome.log || true
          test -s .render/og.png
          ls -l .render/og.png
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "converting with ffmpeg"
            ffmpeg -y -loglevel error -i .render/og.png -vf "scale=1200:630" -q:v 2 og.jpg
          elif python3 -m venv .venv && .venv/bin/pip -q install --disable-pip-version-check pillow; then
            echo "converting with pillow"
            .venv/bin/python - <<'PY'
          from PIL import Image
          im = Image.open('.render/og.png').convert('RGB')
          print('source', im.size)
          if im.size != (1200, 630):
              im = im.resize((1200, 630), Image.LANCZOS)
          im.save('og.jpg', 'JPEG', quality=90, optimize=True, progressive=True)
          print('wrote', Image.open('og.jpg').size)
          PY
          else
            echo "converting with imagemagick"
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            convert .render/og.png -resize 1200x630! -strip -quality 88 og.jpg
          fi
          ls -l og.jpg

      - name: Commit and clean up
        run: |
          set -euo pipefail
          git config user.name "Bereket Tadesse"
          git config user.email "tadessebereket779@gmail.com"
          rm -rf .publish .render .venv .github/workflows/publish-portfolio.yml
          git add -A
          git commit -m "Publish portfolio v2 and add social preview image"
          git push origin HEAD:main
