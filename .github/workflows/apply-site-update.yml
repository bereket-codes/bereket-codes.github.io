name: apply-site-update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          git apply --verbose .github/site-update.patch
          echo "88988401e7505e6023ebc6f276ddad37a09a7e03ce415c8a62c0bb06c89f08b6  index.html" | sha256sum -c -
      - name: Commit and push
        run: |
          git config user.name "Bereket Tadesse"
          git config user.email "tadessebereket779@gmail.com"
          git rm -q .github/site-update.patch .github/workflows/apply-site-update.yml
          git add index.html
          git commit -m "Say junior full stack developer, simplify About and Skills"
          git push
