name: copy-edit

on:
  push:
    paths:
      - .publish/patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply copy edit
        run: python3 .publish/patch.py

      - name: Commit page copy
        run: |
          set -e
          git config user.name "Bereket Tadesse"
          git config user.email "tadessebereket779@gmail.com"
          git add index.html
          git commit -m "Tighten about copy"
          git push origin HEAD:main

      - name: Remove helpers
        run: |
          set -e
          git config user.name "Bereket Tadesse"
          git config user.email "tadessebereket779@gmail.com"
          git rm -q .publish/patch.py
          git rm -q .github/workflows/copy-edit.yml
          git commit -m "chore: remove copy-edit helper"
          git push origin HEAD:main
