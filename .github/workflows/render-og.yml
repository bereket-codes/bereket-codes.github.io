name: render-og

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render og.jpg
        run: |
          set -euo pipefail
          mkdir -p .render
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          [ -n "$chrome" ] || { echo NO_CHROME; exit 1; }
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --force-device-scale-factor=1 --window-size=1200,630 \
            --screenshot="$PWD/.render/og.png" "file://$PWD/.publish/og-card.html" 2> .render/chrome.log || true
          tail -2 .render/chrome.log || true
          test -s .render/og.png
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -loglevel error -i .render/og.png -vf "scale=1200:630" -q:v 3 og.jpg
          else
            python3 -m venv .venv
            .venv/bin/pip -q install --disable-pip-version-check pillow
            .venv/bin/python - <<'PY'
          from PIL import Image
          im = Image.open('.render/og.png').convert('RGB')
          print('source', im.size)
          if im.size != (1200, 630):
              im = im.resize((1200, 630), Image.LANCZOS)
          im.save('og.jpg', 'JPEG', quality=92, optimize=True, progressive=True)
          print('wrote', Image.open('og.jpg').size)
          PY
          fi
          ls -l og.jpg

      - name: Commit and clean up
        run: |
          set -euo pipefail
          git config user.name "Bereket Tadesse"
          git config user.email "tadessebereket779@gmail.com"
          rm -rf .publish .render .venv .github/workflows/render-og.yml
          git add -A
          git commit -m "Refine the social preview image"
          git push origin HEAD:main
